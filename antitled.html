<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiaoyang | Timeline</title>
    <style>
        /* --- 极简主义设计系统 --- */
        :root {
            --bg-color: #FBFBFA;      /* 舒适的微米色背景 */
            --text-main: #1D1D1F;     /* 艺术馆级别的深炭黑 */
            --text-muted: #8E8E93;    /* 优雅的烟灰色 */
            --border-color: #E5E5E5;  /* 极淡的分割线 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 580px; /* 克制的流式布局宽度，保持视觉聚焦 */
            padding: 60px 20px;
        }

        /* --- 个人信息区域 (只在这里展示一次身份) --- */
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
            filter: grayscale(10%); /* 微微去饱和，增加高级感 */
        }

        .user-name {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.8px;
            margin: 0 0 6px 0;
        }

        .bio {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
            letter-spacing: 0.2px;
        }

        /* --- 独立区域导航（主页 / 图片 分区） --- */
        .nav-tabs {
            display: flex;
            gap: 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 35px;
            padding-bottom: 10px;
        }

        .tab-item {
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            letter-spacing: 1px;
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--text-main);
            font-weight: 500;
        }

        /* --- 纯粹的信息流：绝不重复出现用户名 --- */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 45px; /* 空灵的留白 */
        }

        .post-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: opacity 0.3s ease;
        }

        .post-content {
            font-size: 14.5px;
            line-height: 1.65;
            letter-spacing: 0.5px;
            white-space: pre-wrap;
        }

        /* 图片作为独立的视觉区块 */
        .post-image-wrapper {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            background-color: #F2F2F2;
        }

        .post-image {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }

        /* 微博质感的轻量化时间戳 */
        .post-time {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }

        /* --- 相册网格视图 (点击“图片”区时激活) --- */
        .timeline.grid-mode {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .timeline.grid-mode .post-card {
            gap: 0;
        }

        .timeline.grid-mode .post-content, 
        .timeline.grid-mode .post-time {
            display: none; /* 纯相册模式下隐藏文字和时间 */
        }

        .timeline.grid-mode .post-image-wrapper {
            margin-top: 0;
            aspect-ratio: 1 / 1; /* 完美的正方形画廊网格 */
        }
        
        .timeline.grid-mode .post-image {
            height: 100%;
        }
    </style>
</head>
