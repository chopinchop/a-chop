<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jiaoyang | Timeline</title>
    <style>
        :root {
            --bg-color: #FBFBFA;      
            --text-main: #1D1D1F;     
            --text-muted: #8E8E93;    
            --border-color: #E5E5E5;  
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 580px; 
            padding: 60px 20px;
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 20px;
            background-color: #E5E5E5; /* 占位色块，防止网络卡头像 */
        }

        .user-name {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.8px;
            margin: 0 0 6px 0;
        }

        .bio {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
            letter-spacing: 0.2px;
        }

        .nav-tabs {
            display: flex;
            gap: 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 35px;
            padding-bottom: 10px;
        }

        .tab-item {
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            letter-spacing: 1px;
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--text-main);
            font-weight: 500;
        }

        .timeline {
            display: flex;
            flex-direction: column;
            gap: 45px; 
        }

        .post-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-content {
            font-size: 14.5px;
            line-height: 1.65;
            letter-spacing: 0.5px;
            white-space: pre-wrap;
        }

        .post-image-wrapper {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
            background-color: #E5E5E5;
            aspect-ratio: 16 / 9; /* 用纯色高级灰块代替网络图片测试 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8E8E93;
            font-size: 13px;
        }

        .post-time {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
        }

        .timeline.grid-mode {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .timeline.grid-mode .post-card {
            gap: 0;
        }

        .timeline.grid-mode .post-content, 
        .timeline.grid-mode .post-time {
            display: none; 
        }

        .timeline.grid-mode .post-image-wrapper {
            margin-top: 0;
            aspect-ratio: 1 / 1; 
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="profile-header">
            <div class="avatar"></div>
            <div>
                <h1 class="user-name">Jiaoyang</h1>
                <p class="bio">电影摄影 / 视觉知觉。在秩序中寻找某种特定的消逝。</p>
            </div>
        </header>

        <nav class="nav-tabs">
            <span class="tab-item active" id="tab-all" onclick="switchTab('all')">主页</span>
            <span class="tab-item" id="tab-photos" onclick="switchTab('photos')">图片</span>
        </nav>

        <main class="timeline" id="timeline">
            
            <article class="post-card" data-has-image="true">
                <div class="post-content">傍晚的光线在墙上停留了大概十一分钟。那种颗粒感和衰减的方式，很像某种特定时期的反转片。不需要过多的修饰，光线本身就是修辞。</div>
                <div class="post-image-wrapper">
                    <span>[ 视觉占位区块 ]</span>
                </div>
                <div class="post-time">5月18日 17:20</div>
            </article>

            <article class="post-card" data-has-image="false">
                <div class="post-content">声音的密度比视觉更不容易说谎。最近在反复听一些环境音的采样，试图捕捉那种‘空间本身的沉默’。极简不是缺少内容，而是克制住不必要的杂音。</div>
                <div class="post-time">5月16日 10:14</div>
            </article>

        </main>
    </div>

    <script>
        function switchTab(mode) {
            const timeline = document.getElementById('timeline');
            const cards = document.querySelectorAll('.post-card');
            
            document.getElementById('tab-all').classList.toggle('active', mode === 'all');
            document.getElementById('tab-photos').classList.toggle('active', mode === 'photos');

            if (mode === 'all') {
                timeline.classList.remove('grid-mode');
                cards.forEach(card => card.style.display = 'flex');
            } else if (mode === 'photos') {
                timeline.classList.add('grid-mode');
                cards.forEach(card => {
                    if (card.getAttribute('data-has-image') === 'true') {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }
        }
    </script>
</body>
</html>
