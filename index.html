<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>username | Timeline</title>
    <style>
        /* --- 极简主义设计系统 --- */
        :root {
            --bg-color: #FBFBFA;      /* 舒适的微米色背景 */
            --text-main: #1D1D1F;     /* 艺术馆级别的深炭黑 */
            --text-muted: #8E8E93;    /* 优雅的烟灰色 */
            --border-color: #E5E5E5;  /* 极淡的分割线 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 580px; 
            padding: 60px 20px;
        }

        /* --- 个人信息区域 --- */
        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 40px;
        }

        .user-name {
            font-size: 20px;
            font-weight: 500;
            letter-spacing: 0.8px;
            margin: 0;
        }

        /* --- 独立区域导航 --- */
        .nav-tabs {
            display: flex;
            gap: 30px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 35px;
            padding-bottom: 10px;
        }

        .tab-item {
            font-size: 14px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
            letter-spacing: 1px;
        }

        .tab-item:hover {
            color: var(--text-main);
        }

        .tab-item.active {
            color: var(--text-main);
            font-weight: 500;
        }

        /* --- 纯粹的信息流 --- */
        .timeline {
            display: flex;
            flex-direction: column;
            gap: 45px; 
        }

        .post-card {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .post-content {
            font-size: 14.5px;
            line-height: 1.7;
            letter-spacing: 0.6px;
            white-space: pre-wrap;
        }

        /* 图片独立视觉区块 */
        .post-image-wrapper {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .post-image {
            width: 100%;
            height: auto;
            max-height: 450px;
            object-fit: cover;
            display: block;
        }

        /* 微博质感的时间戳 */
        .post-time {
            font-size: 12px;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }

        /* 相册网格视图 */
        .timeline.grid-mode {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .timeline.grid-mode .post-card {
            gap: 0;
        }

        .timeline.grid-mode .post-content, 
        .timeline.grid-mode .post-time {
            display: none; 
        }

        .timeline.grid-mode .post-image-wrapper {
            margin-top: 0;
            aspect-ratio: 1 / 1; 
        }
        
        .timeline.grid-mode .post-image {
            height: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <header class="profile-header">
            <h1 class="user-name">username</h1>
        </header>

        <nav class="nav-tabs">
            <span class="tab-item active" id="tab-all" onclick="switchTab('all')">主页</span>
            <span class="tab-item" id="tab-photos" onclick="switchTab('photos')">图片</span>
        </nav>

        <main class="timeline" id="timeline">

            <article class="post-card" data-has-image="false">
                <div class="post-content">你好，今天是我第一次纪录，我今天要做三件事情：
1. 做这个网页
2. 了解上一个丙午年的世界
3. 咨询八字课程的事情

今天喝了一杯巴拿马瑰夏，有木槿花和玉兰花的味道。长沙，5月，你们要在白天坐车，就可以看到这个白玉兰的季节。</div>
                <div class="post-time">5月18日 🌑 18:18</div>
            </article>

            <article class="post-card" data-has-image="true">
                <div class="post-content">在低饱和度的色彩系统里，物体的质感会被放大。这也是为什么有些材质只能在阴天或者微弱的漫反射光线下才能展现出它的呼吸感。</div>
                <div class="post-image-wrapper">
                    <img class="post-image" src="https://images.unsplash.com/photo-1518156677180-95a2893f3e9f?w=1000" alt="Post Image">
                </div>
                <div class="post-time">5月12日 🌒 23:43</div>
            </article>

        </main>
    </div>

    <script>
        function switchTab(mode) {
            const timeline = document.getElementById('timeline');
            const cards = document.querySelectorAll('.post-card');
            
            document.getElementById('tab-all').classList.toggle('active', mode === 'all');
            document.getElementById('tab-photos').classList.toggle('active', mode === 'photos');

            if (mode === 'all') {
                timeline.classList.remove('grid-mode');
                cards.forEach(card => card.style.display = 'flex');
            } else if (mode === 'photos') {
                timeline.classList.add('grid-mode');
                cards.forEach(card => {
                    if (card.getAttribute('data-has-image') === 'true') {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }
        }
    </script>
</body>
</html>
